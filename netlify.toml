# Netlify publishes site/ as-is. No build step.
# Everything outside site/ (README, scripts/, tools/) stays in the repo
# and off the web.
[build]
  publish = "site"
[[redirects]]
  from = "https://benatlarge.com/*"
  to = "https://bendoylegray.com/"
  status = 301
  force = true

[[redirects]]
  from = "https://www.benatlarge.com/*"
  to = "https://bendoylegray.com/"
  status = 301
  force = true

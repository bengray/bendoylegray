# Netlify runs Eleventy, which builds src/ into _site/, and publishes
# _site/. Everything outside src/ (README, tools/) stays in the repo
# and off the web.
[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "https://benatlarge.com/*"
  to = "https://bendoylegray.com/"
  status = 301
  force = true

[[redirects]]
  from = "https://www.benatlarge.com/*"
  to = "https://bendoylegray.com/"
  status = 301
  force = true

# The proof sheet was folded into the front page (Nov 2026).
[[redirects]]
  from = "/proofs"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/proofs.html"
  to = "/"
  status = 301
  force = true

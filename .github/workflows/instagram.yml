name: Pull latest Instagram photos

# Every six hours, fetch the newest @ben.atlarge photos, commit them
# if they changed, and netlify deploys from the push. Also runnable by hand from the Actions tab.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   IG_TOKEN  required. Long-lived Instagram User access token.
#   GH_PAT    optional. Fine-grained token with "Secrets: read and write"
#             on this repo. Lets the job save the refreshed IG_TOKEN back
#             so it never expires. Without it you'll need to paste a new
#             IG_TOKEN every ~60 days.

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    env:
      HAS_PAT: ${{ secrets.GH_PAT != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch from Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: node scripts/instagram.mjs

      - name: Save refreshed token
        if: env.HAS_PAT == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -s "$RUNNER_TEMP/ig_token" ]; then
            gh secret set IG_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/ig_token"
            rm "$RUNNER_TEMP/ig_token"
          fi

      - name: Commit if anything changed
        id: commit
        run: |
          git add site/instagram.json site/photos/instagram
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Pull latest Instagram photos"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
